# deploy/units.toml
# Deployable unit manifest for jbirdkerr.net monorepo.
# Defines the relationship between path changes, Pants targets, and deployment environments.

[units.blog]
name = "blog"
paths = ["blog/**"]
host = "github-pages"
build = "blog:dist"
deploy = "blog:deploy"
depends_on = []
environments = ["production"]

[units.boopmaster]
name = "boopmaster"
paths = ["apps/boopmaster/**"]
host = "cloudflare-pages"
build = "apps/boopmaster:dist"
deploy = "apps/boopmaster:deploy"
depends_on = []
environments = ["preview", "production"]

[units.digdog]
name = "digdog"
paths = ["apps/digdog/**"]
host = "cloudflare-pages"
build = "apps/digdog:dist"
deploy = "apps/digdog:deploy"
depends_on = []
environments = ["preview", "production"]

[units.db]
name = "db"
paths = ["db/supabase/migrations/**"]
host = "supabase"
build = "db/supabase:files"
deploy = "db/supabase:push"
depends_on = []
environments = ["preview", "production"]

[units.metrics-worker]
name = "metrics-worker"
paths = ["apps/metrics-worker/**"]
host = "cloudflare-worker"
build = "apps/metrics-worker:dist"
deploy = "apps/metrics-worker:deploy"
depends_on = ["db"]
environments = ["preview", "production"]

[units.shortener]
name = "shortener"
paths = ["apps/shortener/**"]
host = "cloudflare-worker"
build = "apps/shortener:dist"
deploy = "apps/shortener:deploy"
depends_on = ["db"]
environments = ["preview", "production"]
